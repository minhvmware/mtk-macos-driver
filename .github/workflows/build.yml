name: Build & Test MT7902 macOS Native Driver

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  host-unit-tests:
    name: HAL, Firmware, 802.11 & BT Unit Tests (Linux C++17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev python3
      - name: Ensure firmware tables exist
        run: |
          if [ ! -f AirportMT7902/Firmware/MT7902WifiFwData.cpp ] || [ ! -f MT7902BluetoothFirmware/Firmware/MT7902BtFwData.cpp ]; then
            python3 scripts/pack_firmware.py --stub
          fi
      - name: Validate Info.plist bundles & generate Xcode project
        run: |
          python3 scripts/generate_xcode_project.py
          python3 -c 'import plistlib, glob; [plistlib.load(open(p, "rb")) for p in glob.glob("**/*.plist", recursive=True)]'
      - name: Run C++17 Hardware Simulation & Protocol Tests
        run: make test

  macos-kexts:
    name: Build All 6 macOS Kexts (Ventura / Sonoma / Sequoia / Tahoe / BT Fw / BT Patcher)
    runs-on: macos-15
    needs: host-unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install Acidanthera MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: MacKernelSDK
      - name: Install Acidanthera Lilu 1.7.2 DEBUG SDK (for MT7902BluetoothPatcher)
        run: |
          curl -fsSL https://github.com/acidanthera/Lilu/releases/download/1.7.2/Lilu-1.7.2-DEBUG.zip -o /tmp/Lilu-1.7.2-DEBUG.zip
          unzip -oq /tmp/Lilu-1.7.2-DEBUG.zip -d .
          rm -f /tmp/Lilu-1.7.2-DEBUG.zip
          test -f Lilu.kext/Contents/Resources/Library/plugin_start.cpp
      - name: Ensure Xcode project & firmware tables
        run: |
          if [ ! -f AirportMT7902/Firmware/MT7902WifiFwData.cpp ] || [ ! -f MT7902BluetoothFirmware/Firmware/MT7902BtFwData.cpp ]; then
            python3 scripts/pack_firmware.py --stub
          fi
          python3 scripts/generate_xcode_project.py
      - name: Build all 6 native macOS .kext targets (x86_64 Release)
        run: |
          set -euo pipefail
          mkdir -p logs dist
          TARGETS=(
            "AirportMT7902-Ventura:Ventura:AirportMT7902.kext"
            "AirportMT7902-Sonoma:Sonoma:AirportMT7902.kext"
            "AirportMT7902-Sequoia:Sequoia:AirportMT7902.kext"
            "AirportMT7902-Tahoe:Tahoe:AirportMT7902.kext"
            "MT7902BluetoothFirmware:Bluetooth:MT7902BluetoothFirmware.kext"
            "MT7902BluetoothPatcher:Bluetooth:MT7902BluetoothPatcher.kext"
          )
          FAILED=0
          for entry in "${TARGETS[@]}"; do
            IFS=':' read -r SCHEME SUBDIR KEXT <<< "$entry"
            echo "================================================================"
            echo "[*] Building $SCHEME -> $SUBDIR/$KEXT"
            echo "================================================================"
            if ! xcodebuild -project MT7902MacOS.xcodeproj \
              -scheme "$SCHEME" \
              -configuration Release \
              ARCHS=x86_64 \
              SYMROOT="$PWD/build/products" \
              OBJROOT="$PWD/build/obj/$SUBDIR" \
              CODE_SIGNING_ALLOWED=NO \
              build > "logs/$SCHEME.log" 2>&1; then
              echo "[ERR] Failed building $SCHEME:"
              grep -E -A 4 "error:|fatal error:|Undefined symbols" "logs/$SCHEME.log" || tail -n 120 "logs/$SCHEME.log"
              FAILED=1
            else
              mkdir -p "dist/$SUBDIR"
              cp -R "$PWD/build/products/Release/$SUBDIR/$KEXT" "dist/$SUBDIR/"
              ditto -c -k --keepParent "dist/$SUBDIR/$KEXT" "dist/${SCHEME}-Release.zip"
              echo "[OK] Built dist/$SUBDIR/$KEXT"
            fi
          done
          exit "$FAILED"
      - uses: actions/upload-artifact@v4
        with:
          name: MT7902-macOS-Kexts-Release
          path: dist/*.zip
          if-no-files-found: error
